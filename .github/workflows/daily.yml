name: Daily Portfolio Dashboard

on:
  schedule:
    - cron: "30 11 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  daily-dashboard:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run daily portfolio dashboard
        run: python src/run_daily.py

      - name: Commit updated daily report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/daily_dashboard.md
          if git diff --staged --quiet; then
            echo "No daily report changes to commit."
          else
            git commit -m "Update daily portfolio dashboard"
            git push
          fi
