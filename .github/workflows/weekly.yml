name: Weekly Stock Picker

on:
  schedule:
    - cron: "30 12 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  weekly-stock-picker:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run weekly stock picker
        run: python src/run_weekly.py

      - name: Commit updated weekly reports
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add reports/weekly_report.md reports/portfolio_actions.md
          if git diff --staged --quiet; then
            echo "No weekly report changes to commit."
          else
            git commit -m "Update weekly stock picker reports"
            git push
          fi
